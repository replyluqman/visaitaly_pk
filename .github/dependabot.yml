# Version-update PRs are disabled (limit 0). Security updates are unaffected.
version: 2
updates:
  # pnpm uses the "npm" ecosystem. One PR for all minor/patch bumps per week;
  # majors arrive individually so each gets its own review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
