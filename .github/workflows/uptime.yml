name: Uptime

# Free uptime check with no new vendor (docs/OBSERVABILITY.md). A failed run
# emails whoever is watching the repo's Actions. GitHub may delay or skip
# scheduled runs under load, so treat this as a backstop, not a pager.
# Scheduled workflows only run from the default branch.
#
# Uses repository variables (not GitHub Environments) on purpose: referencing an
# environment records a deployment, which every 15 minutes would bury real ones.
#   vars.STAGING_API_URL     e.g. https://api-staging.visaitaly.pk
#   vars.PRODUCTION_API_URL  e.g. https://api.visaitaly.pk

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging
            url_var: STAGING_API_URL
          - name: production
            url_var: PRODUCTION_API_URL
    steps:
      - name: GET /health (${{ matrix.name }})
        env:
          BASE: ${{ vars[matrix.url_var] }}
        run: |
          if [ -z "$BASE" ]; then echo "${{ matrix.url_var }} not set — skipping."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 2 --retry-delay 5 "$BASE/health")
          echo "HTTP $code"
          test "$code" = "200"
