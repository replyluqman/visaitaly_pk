name: CI

# Gates 1 (static) and the migration-reversibility rule run on every push and PR.
# Deploys: main → staging automatically; a v* tag → production behind the
# `production` GitHub Environment (configure required reviewers in repo settings).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · contract · config · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vip_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the immutability check needs the merge base
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Gate 1 — typecheck
        run: pnpm typecheck

      - name: OpenAPI contract lint
        run: pnpm lint:openapi

      - name: Wrangler config — every env bundles with its own bindings
        working-directory: apps/api
        run: |
          set -euo pipefail
          for env in "" staging production; do
            label="${env:-development}"
            out=$(npx wrangler deploy --dry-run ${env:+--env "$env"} --outdir "$RUNNER_TEMP/wd-$label" 2>&1) || { echo "$out"; exit 1; }
            if grep -qi "not inherited" <<<"$out"; then
              echo "$out"; echo "::error::$label is missing a binding (bindings are not inherited by [env.*])"; exit 1
            fi
            echo "✓ $label"
          done

      # Applied migrations are history. Editing one makes every environment divergent.
      - name: Applied migrations are immutable
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- apps/api/migrations | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified or removed. Add a new migration instead."
            echo "$changed"; exit 1
          fi

      # Real content in a migration reaches production automatically (ADR 0007).
      - name: No content in migrations
        run: |
          if grep -nE "INSERT INTO (legal_versions|requirements)" apps/api/migrations/*.sql | grep -v '\.down\.sql'; then
            echo "::error::Content belongs in apps/api/seed/, not in the migration chain."; exit 1
          fi

      - name: Migrations — apply, full rollback, re-apply, identical schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vip_ci
        run: node scripts/migrate-roundtrip.mjs

      # Gate 4 — a foreign key without a covering index seq-scans the child on parent changes.
      - name: Every foreign key has a covering index
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vip_ci
        run: |
          pnpm db:migrate
          uncovered=$(psql "$DATABASE_URL" -tAc "
            SELECT c.conrelid::regclass || '.' || a.attname
              FROM pg_constraint c
              JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = c.conkey[1]
             WHERE c.contype = 'f'
               AND NOT EXISTS (
                 SELECT 1 FROM pg_index i
                  WHERE i.indrelid = c.conrelid AND i.indkey[0] = c.conkey[1]
                    AND i.indpred IS NULL)") # unconditional only: a partial index cannot serve cascades / erasure
          if [ -n "$uncovered" ]; then
            echo "::error::Foreign keys without a covering index:"; echo "$uncovered"; exit 1
          fi

      - name: Gate 2/3 — unit + integration (real Postgres)
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vip_ci
        run: pnpm test

      # Gate 4 on the pieces that can run in CI: EXPLAIN at 30k users / 75k applicants.
      - name: Gate 4 — EXPLAIN at volume
        working-directory: apps/api
        env:
          PGPASSWORD: postgres
          LOAD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vip_load_ci
        run: |
          createdb -h localhost -U postgres vip_load_ci
          DATABASE_URL="$LOAD_DATABASE_URL" node scripts/migrate.mjs up
          psql "$LOAD_DATABASE_URL" -q -f seed/seed_load.sql
          pnpm gate4

  deploy-staging:
    name: Deploy → staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate staging (direct Neon URL, not Hyperdrive)
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: pnpm db:migrate
      - name: Preflight
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: pnpm preflight --env staging
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm api:deploy:staging
      - name: Smoke
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_BASE_URL }}/health"

  deploy-production:
    name: Deploy → production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Migrations are expand-only by policy (docs/SCALE.md), so applying them
      # before the new Worker is live is always safe for the old Worker.
      - name: Migrate production
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: pnpm db:migrate
      - name: Preflight
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: pnpm preflight --env production
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm api:deploy:production
      - name: Smoke
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_BASE_URL }}/health"
