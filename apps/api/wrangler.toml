name = "visaitaly-api"
main = "src/index.ts"
compatibility_date = "2024-11-27"

# pg over TCP needs the Node compat layer. Without this the Worker fails at
# import time, not at query time — the error is confusing if you forget it.
compatibility_flags = ["nodejs_compat"]

# Workers Logs: persists console.* output (structured JSON, docs/OBSERVABILITY.md).
# Free-plan daily volume and retention are limited — verify current limits on the
# account before relying on it for incident forensics.
[observability]
enabled = true
head_sampling_rate = 1

# ─────────────────────────────────────────────────────────────────────────────
# THREE ENVIRONMENTS — read before editing.
#   (top level)      local development, `wrangler dev`. Never deployed.
#   [env.staging]    real Workers runtime + a Neon branch + its own Firebase project.
#   [env.production]
#
# Bindings (hyperdrive, kv_namespaces, r2_buckets, …) are NOT inherited by
# [env.*]; every environment declares its own full set. The file once declared
# them only at the top level, so `--env production` deployed a Worker with NO
# database and NO JWK cache: it booted, then 500'd every /v1 request. CI bundles
# every environment and fails on the "not inherited" warning.
#
# Never run a bare `wrangler deploy` (it ships the development block). Use
# `pnpm api:deploy:staging` / `pnpm api:deploy:production`; there is deliberately
# no bare script. Each environment uses a SEPARATE Firebase project: tokens carry
# the project id as audience, so a staging token is rejected by production.
#
# Never declare FIREBASE_AUTH_EMULATOR_HOST here: with it set, tokens are accepted
# UNSIGNED. Local emulator use goes in apps/api/.dev.vars only (the code ignores it
# outside development and `pnpm preflight` fails a config that declares it).
# ─────────────────────────────────────────────────────────────────────────────

# ── development (top level, `wrangler dev`) ─────────────────────────────────
[vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "REPLACE_ME_firebase_project_id_dev"
# Admin tokens come from a SEPARATE Firebase project (ADR 0012). Never the same id as above.
ADMIN_FIREBASE_PROJECT_ID = "REPLACE_ME_admin_firebase_project_id_dev"
ADMIN_REQUIRE_MFA = "false"
PUBLIC_JWK_CACHE_KEY = "firebase-public-jwks"

# Pooled Neon connection. PRD §4 — mandatory, not optional.
# Create with: wrangler hyperdrive create visaitaly-db-dev --connection-string="postgres://..."
# Local dev without Hyperdrive: set WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
# in .dev.vars-adjacent shell env to a local Postgres URL.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_ME_hyperdrive_id_dev"

# Caches Google's public JWKs so token verification is not a network round trip.
# Create with: wrangler kv namespace create PUBLIC_JWK_CACHE_KV
[[kv_namespaces]]
binding = "PUBLIC_JWK_CACHE_KV"
id = "REPLACE_ME_kv_namespace_id_dev"

# Private bucket for user documents. Never enable public access or issue S3 credentials: the
# Worker is the only reader/writer (docs/SECURITY.md). Create: wrangler r2 bucket create <name>
# Secret (not here): DOCUMENTS_SIGNING_KEY — `openssl rand -base64 48 | wrangler secret put DOCUMENTS_SIGNING_KEY`
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "replace-me-r2-bucket-dev"

# Cron Worker — ONE trigger for every background job (src/jobs.ts): notifications, push, Today, hash sweep,
# retention. Never on a user request (PRD §4). One trigger because Cloudflare caps cron triggers per account.
[triggers]
crons = ["*/5 * * * *"]

# ── staging (`wrangler deploy --env staging`) ──────────────────────────────
# Own Neon branch, own Firebase project, own KV. Never shares data with prod.
[env.staging]
name = "visaitaly-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FIREBASE_PROJECT_ID = "REPLACE_ME_firebase_project_id_staging"
ADMIN_FIREBASE_PROJECT_ID = "REPLACE_ME_admin_firebase_project_id_staging"
ADMIN_REQUIRE_MFA = "true"
PUBLIC_JWK_CACHE_KEY = "firebase-public-jwks"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_ME_hyperdrive_id_staging"

[[env.staging.kv_namespaces]]
binding = "PUBLIC_JWK_CACHE_KV"
id = "REPLACE_ME_kv_namespace_id_staging"

[[env.staging.r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "replace-me-r2-bucket-staging"

[env.staging.triggers]
crons = ["*/5 * * * *"]

# ── production (`wrangler deploy --env production`) ─────────────────────────
[env.production]
name = "visaitaly-api"

[env.production.vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "REPLACE_ME_firebase_project_id_prod"
ADMIN_FIREBASE_PROJECT_ID = "REPLACE_ME_admin_firebase_project_id_prod"
ADMIN_REQUIRE_MFA = "true"
PUBLIC_JWK_CACHE_KEY = "firebase-public-jwks"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_ME_hyperdrive_id_prod"

[[env.production.kv_namespaces]]
binding = "PUBLIC_JWK_CACHE_KV"
id = "REPLACE_ME_kv_namespace_id_prod"

[[env.production.r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "replace-me-r2-bucket-prod"

[env.production.triggers]
crons = ["*/5 * * * *"]

# No secrets in this file. Set them with `wrangler secret put <NAME> --env <env>`.
