  /v1/admin/admins/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch: { tags: [admin], security: [ { firebaseAdmin: [] } ], summary: 'Rename, enable/disable, promote/demote, replace scopes. Lock-out guards: no self-disable/demote, last active super stays.', x-scope: [super_admin], x-status: live, x-module: "4a", responses: { '200': { description: ok }, '404': { description: not found }, '409': { description: lock-out guard } } }
  /v1/admin/audit-log:
    get: { tags: [admin], security: [ { firebaseAdmin: [] } ], summary: 'Audit viewer (Screen 45). Filters: actorId, action, targetType, targetId; keyset.', x-scope: [any admin], x-status: live, x-module: "4a", parameters: [ { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { description: ok } } }
components:
  securitySchemes:
    firebaseUser: { type: http, scheme: bearer, bearerFormat: Firebase ID token (user project) }
    deviceId: { type: apiKey, in: header, name: X-Device-Id, description: 'Client-generated UUIDv4, persisted in flutter_secure_storage' }
    firebaseAdmin: { type: http, scheme: bearer, bearerFormat: 'Firebase ID token (admin project, MFA enforced)' }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Locale: { name: locale, in: query, schema: { type: string, pattern: '^[a-z]{2}$' }, description: 'Label locale; anything else falls back to en. Urdu is gated by PRD §11a.' }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 200 }, description: Opaque; from previous nextCursor }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }

  responses:
    Unauthenticated: { description: 'UNAUTHENTICATED / DEVICE_* / USER_DELETED — terminal, client wipes session', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: 'NOT_FOUND — also returned for other users'' resources', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: CONFLICT or a specific 409 code, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ReadOnly: { description: 'APPLICANT_READ_ONLY — grace / expired (PRD §7)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    PremiumRequired: { description: 'PREMIUM_REQUIRED — free tier beyond preview', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ValidationFailed: { description: VALIDATION_FAILED with details, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    RateLimited: { description: RATE_LIMITED, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: |
                Live: UNAUTHENTICATED DEVICE_HEADER_MISSING DEVICE_UNKNOWN DEVICE_EVICTED DEVICE_SIGNED_OUT USER_DELETED
                APPLICANT_LIMIT_REACHED APPLICANT_READ_ONLY LEGAL_ACCEPTANCE_REQUIRED ONBOARDING_STEP_INVALID
                PREMIUM_REQUIRED CHECKLIST_CONFLICT UPLOAD_TOO_LARGE UPLOAD_QUOTA_EXCEEDED UPLOAD_REJECTED ADMIN_FORBIDDEN ADMIN_MFA_REQUIRED REAUTH_REQUIRED
                VALIDATION_FAILED NOT_FOUND CONFLICT RATE_LIMITED INTERNAL.
                Each new code also needs a row in STATUS_BY_CODE (apps/api/src/lib/errors.ts; compiler-enforced) and a
                decision on whether it is session-terminal. UNAUTHENTICATED: refresh the token once and retry before signing out.
                Planned (add to packages/shared/src/errors.ts with their module): see x-module on each path
                PRICE_CHANGED APPLICANT_ALREADY_PREMIUM
                ORDER_NOT_AWAITING_PAYMENT ORDER_NOT_PENDING RECEIPT_NOT_READY REFUND_NOT_ELIGIBLE REFUND_ALREADY_OPEN
                SUPPORT_TOPIC_NOT_ALLOWED REFERRAL_ALREADY_CLAIMED REFERRAL_SELF REFERRAL_TOO_LATE INSUFFICIENT_CREDIT
                BELOW_MIN_WITHDRAWAL PAYOUT_ACCOUNT_MISSING REAUTH_REQUIRED APP_VERSION_UNSUPPORTED ADMIN_SCOPE_REQUIRED.
            message: { type: string }
            details: { type: object, additionalProperties: { type: array, items: { type: string } } }
            requestId: { type: string }

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, description: 'Minor units. €99.99 = 9999' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    LocalizedText: { type: string, description: Resolved server-side to the user's locale }

    JourneyStage: { type: string, enum: [eligibility, nulla_osta, documents, translation, appointment, application, processing, decision] }
    AccessLevel: { type: string, enum: [free, premium, grace_read_only, expired] }
    ItemDisplayStatus: { type: string, enum: [not_started, in_progress, ready, issue_found, not_applicable] }
    ItemStatusWritable: { type: string, enum: [not_started, in_progress, ready, issue_found] }
    Badge: { type: string, enum: [blocking, needs_review, source_under_review] }

    RegisterSessionInput:
      type: object
      required: [deviceId, platform, appVersion]
      properties:
        deviceId: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        appVersion: { type: string, maxLength: 32 }
        osVersion: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        fcmToken: { type: string, maxLength: 512 }
    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, 'null'] }
            displayName: { type: [string, 'null'] }
            onboardingState: { type: string, enum: [disclaimer_pending, applicants_pending, stage_pending, complete] }
            createdAt: { type: string, format: date-time }
        entitlement:
          type: object
          properties:
            premiumApplicantIds: { type: array, items: { type: string, format: uuid } }
            graceApplicantIds: { type: array, items: { type: string, format: uuid }, description: 'PRD §7 grace — full read, no writes' }
            hasAnyPremium: { type: boolean }
        devices:
          type: object
          properties: { maxActive: { type: integer }, activeCount: { type: integer } }
        legal:
          type: object
          description: Non-empty pendingDocTypes → route to the Disclaimer Gate (also after a version bump)
          properties:
            requiresAcceptance: { type: boolean }
            pendingDocTypes: { type: array, items: { type: string, enum: [disclaimer, terms, privacy] } }
        applicants:
          type: object
          properties:
            declaredCount: { type: [integer, 'null'], description: 'Screen 5 intent, not a count' }
            total: { type: integer }
            awaitingStage: { type: integer, description: Drives the Screen 7 resume point }
    RegisterSessionResponse:
      allOf:
        - $ref: '#/components/schemas/MeResponse'
        - type: object
          properties:
            session:
              type: object
              properties:
                evictedDeviceIds: { type: array, items: { type: string, format: uuid } }
                isNewUser: { type: boolean }
    DeviceSummary:
      type: object
      properties:
        deviceId: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        model: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        lastLoginAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        isCurrent: { type: boolean }

    LegalVersionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        docType: { type: string, enum: [disclaimer, terms, privacy] }
        locale: { type: string }
        version: { type: string }
        title: { type: string }
        isMandatory: { type: boolean }
        publishedAt: { type: [string, 'null'], format: date-time }
        accepted: { type: boolean }
    CurrentLegalResponse:
      type: object
      properties:
        documents: { type: array, items: { $ref: '#/components/schemas/LegalVersionSummary' } }
        requiresAcceptance: { type: boolean }
    LegalDocumentResponse:
      allOf: [ { $ref: '#/components/schemas/LegalVersionSummary' }, { type: object, properties: { bodyMd: { type: string } } } ]

    RelationshipOption:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        category: { type: string, enum: [spouse, child, parent] }
        requiresDob: { type: boolean }
    CreateApplicantInput:
      type: object
      required: [displayName, relationshipCode, currentLocation]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        relationshipCode: { type: string, maxLength: 32 }
        dateOfBirth: { type: string, format: date }
        currentLocation: { type: string, enum: [pakistan, italy, other] }
        nullaOstaStatus: { type: string, enum: [not_applicable, not_started, in_process, received] }
        nullaOstaIssueDate: { type: string, format: date }
        nullaOstaExpiryDate: { type: string, format: date }
        currentStage: { $ref: '#/components/schemas/JourneyStage' }
    PatchApplicantInput:
      allOf: [ { $ref: '#/components/schemas/CreateApplicantInput' } ]
      description: All fields optional; at least one required.
    ApplicantWithOnboarding:
      type: object
      properties:
        applicant: { $ref: '#/components/schemas/Applicant' }
        onboardingState: { type: string, enum: [disclaimer_pending, applicants_pending, stage_pending, complete] }
    Applicant:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        relationshipCode: { type: string }
        relationshipLabel: { type: string }
        relationshipCategory: { type: string, enum: [spouse, child, parent] }
        dateOfBirth: { type: [string, 'null'], format: date }
        currentLocation: { type: string, enum: [pakistan, italy, other] }
        currentStage: { oneOf: [ { $ref: '#/components/schemas/JourneyStage' }, { type: 'null' } ] }
        stageUpdatedAt: { type: [string, 'null'], format: date-time }
        caseGeneratedAt: { type: [string, 'null'], format: date-time }
        nullaOsta:
          type: object
          properties:
            status: { type: string }
            issueDate: { type: [string, 'null'], format: date }
            expiryDate: { type: [string, 'null'], format: date }
            daysRemaining: { type: [integer, 'null'] }
        access:
          type: object
          properties:
            level: { $ref: '#/components/schemas/AccessLevel' }
            canWrite: { type: boolean }
            accessUntil: { type: [string, 'null'], format: date-time }
            graceUntil: { type: [string, 'null'], format: date-time }
        readiness:
          type: object
          description: Derived on read, never stored. All zeros until a case is generated.
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            applicableCount: { type: integer }
            readyCount: { type: integer }
            blockingCount: { type: integer }
            notApplicableCount: { type: integer }
            categorySpecificCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ApplicantListResponse:
      type: object
      properties:
        applicants: { type: array, items: { $ref: '#/components/schemas/Applicant' } }
        maxApplicants: { type: integer }
        combinedReadiness: { type: integer, x-status: planned }
    JourneyResponse:
      type: object
      properties:
        currentStage: { $ref: '#/components/schemas/JourneyStage' }
        stages:
          type: array
          items:
            type: object
            properties:
              stage: { $ref: '#/components/schemas/JourneyStage' }
              state: { type: string, enum: [done, current, upcoming] }
              itemCount: { type: integer }
              readyCount: { type: integer }

    ChecklistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        requirementCode: { type: string }
        stage: { $ref: '#/components/schemas/JourneyStage' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        status: { $ref: '#/components/schemas/ItemDisplayStatus' }
        badges: { type: array, items: { $ref: '#/components/schemas/Badge' } }
        notApplicableReason: { type: [string, 'null'] }
        translationRequired: { type: boolean }
        apostilleRequired: { type: boolean }
        lastVerifiedAt: { type: string, format: date-time }
        requirementVersion: { type: integer }
        documentCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    ChecklistItemDetail:
      allOf:
        - $ref: '#/components/schemas/ChecklistItem'
        - type: object
          properties:
            purpose: { type: string }
            whoProvides: { type: string }
            whereToObtain: { type: string }
            recommendedTiming: { type: string }
            conditionNote: { type: [string, 'null'] }
            source:
              type: object
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                document: { type: [string, 'null'] }
                publishedAt: { type: [string, 'null'], format: date }
            documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
            canWrite: { type: boolean }
    ChecklistResponse:
      type: object
      properties:
        applicantId: { type: string, format: uuid }
        items: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        lockedCount: { type: integer, description: 'Free tier: number of items hidden behind the paywall ("+18 more documents")' }
        nextCursor: { type: [string, 'null'] }
        syncedAt: { type: string, format: date-time, description: Pass as `since` on next delta sync }
    PatchChecklistItemInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ItemStatusWritable' }
        baseVersion: { type: integer, description: requirementVersion the client last saw; omit when online }
        clientMutationAt: { type: string, format: date-time }

    UploadUrlInput:
      type: object
      required: [mime, sizeBytes, sha256]
      properties:
        mime: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        applicantId: { type: string, format: uuid }
        checklistItemId: { type: string, format: uuid }
        expiryDate: { type: string, format: date }
    UploadUrlResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        requiredHeaders: { type: object, additionalProperties: { type: string } }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicantId: { type: string, format: uuid }
        checklistItemId: { type: [string, 'null'], format: uuid }
        mime: { type: string }
        sizeBytes: { type: integer }
        expiryDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        viewUrl: { type: [string, 'null'], format: uri, description: 'Short-lived signed GET, detail only' }
    DocumentList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Document' } }
        nextCursor: { type: [string, 'null'] }
        quota: { type: object, properties: { usedBytes: { type: integer }, maxBytes: { type: integer } } }
    SignedUrl:
      type: object
      properties: { url: { type: string, format: uri }, expiresAt: { type: string, format: date-time } }

    TodayResponse:
      type: object
      properties:
        actions:
          type: array
          maxItems: 5
          items:
            type: object
            description: Structured — the client composes the sentence. No server prose.
            properties:
              kind: { type: string, enum: [expiring, blocking, todo] }
              reason: { type: string, enum: [document_expires, nulla_osta_expires, blocks_submission, issue_found, in_progress, not_started] }
              title: { type: [string, 'null'], description: CMS requirement title; null for applicant-level actions }
              applicantId: { type: string, format: uuid }
              itemId: { type: [string, 'null'], format: uuid }
              dueDate: { type: [string, 'null'], format: date }
              deepLink: { type: string, description: 'App-relative path, e.g. /checklist/<id>' }
        allClear:
          type: [object, 'null']
          description: Present only when actions is empty.
          properties: { nextStage: { oneOf: [ { $ref: '#/components/schemas/JourneyStage' }, { type: 'null' } ] } }
        computedAt: { type: [string, 'null'], format: date-time, description: 'Oldest materialisation among the user''s premium applicants; null = not computed yet' }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        tab: { type: string, enum: [reminder, update, activity] }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        applicantId: { type: [string, 'null'], format: uuid }
        orderId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    NotificationList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: [string, 'null'] }
    NotificationPreferences:
      type: object
      properties:
        push:
          type: object
          properties: { reminder: { type: boolean }, update: { type: boolean }, activity: { type: boolean } }

    EligibilityQuestionSet:
      type: object
      properties:
        version: { type: integer }
        disclaimer: { type: string }
        questions:
          type: array
          maxItems: 6
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              options: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
    EligibilityAnswers:
      type: object
      required: [version, answers]
      properties:
        version: { type: integer }
        answers: { type: object, additionalProperties: { type: string, maxLength: 64 }, maxProperties: 6 }
    EligibilityResult:
      type: object
      description: Orientation only. Copy is CMS-owned and lawyer-reviewed. Never contains verdict language.
      properties:
        summary: { type: string }
        typicalItems: { type: array, maxItems: 3, items: { type: object, properties: { title: { type: string }, why: { type: string } } } }
        lockedCount: { type: integer }
        disclaimer: { type: string }
        whatsappUrl: { type: [string, 'null'], format: uri }

    VerificationSummary:
      type: object
      properties:
        requirementsTracked: { type: integer }
        sourceLinkedPercent: { type: integer }
        lastSweepAt: { type: string, format: date-time }
        openFlags: { type: integer }
        recentUpdates:
          type: array
          items:
            type: object
            properties:
              requirementTitle: { type: string }
              changeSummary: { type: string }
              effectiveDate: { type: string, format: date }
              publishedAt: { type: string, format: date-time }

    PricingResponse:
      type: object
      properties:
        premium: { type: object, properties: { first: { $ref: '#/components/schemas/Money' }, additional: { $ref: '#/components/schemas/Money' } } }
        appointment: { type: object, properties: { first: { $ref: '#/components/schemas/Money' }, additional: { $ref: '#/components/schemas/Money' } } }
        translationDocTypes:
          type: array
          items: { type: object, properties: { code: { type: string }, label: { type: string }, price: { $ref: '#/components/schemas/Money' } } }
        courierFee: { $ref: '#/components/schemas/Money' }
        referralCredit: { $ref: '#/components/schemas/Money' }
    PublicConfig:
      type: object
      properties:
        minSupportedAppVersion: { type: string }
        sla: { type: object, properties: { paymentHours: { type: integer }, supportPaidHours: { type: integer }, supportFreeHours: { type: integer } } }
        workingHoursText: { type: string }
        urduAvailable: { type: boolean }
        whatsappUrl: { type: [string, 'null'] }

    OrderDraft:
      type: object
      required: [service]
      properties:
        service: { type: string, enum: [premium, translation, appointment] }
        applicantIds: { type: array, items: { type: string, format: uuid }, maxItems: 20, description: premium / appointment }
        translationItems:
          type: array
          maxItems: 30
          items: { type: object, required: [docTypeCode, quantity], properties: { docTypeCode: { type: string }, quantity: { type: integer, minimum: 1, maximum: 20 }, applicantId: { type: string, format: uuid } } }
        applyCredit: { type: boolean, description: Ignored for premium (PRD §15) }
    Quote:
      type: object
      properties:
        quoteToken: { type: string, description: 'Signed hash of priced inputs; required on POST /orders so a price change between quote and order returns PRICE_CHANGED' }
        lines:
          type: array
          items:
            type: object
            properties:
              category: { type: string, enum: [visaitaly_service, courier, official, service_provider] }
              label: { type: string }
              quantity: { type: integer }
              unit: { $ref: '#/components/schemas/Money' }
              total: { $ref: '#/components/schemas/Money' }
        creditApplied: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        payable: { $ref: '#/components/schemas/Money' }
        refundTerms: { type: string }
        requiresWithdrawalWaiver: { type: boolean }
    CreateOrderInput:
      allOf:
        - $ref: '#/components/schemas/OrderDraft'
        - type: object
          required: [clientRequestId, quoteToken, acceptedTerms]
          properties:
            clientRequestId: { type: string, format: uuid }
            quoteToken: { type: string }
            acceptedTerms: { type: boolean, const: true }
            withdrawalWaiver: { type: boolean }
            delivery:
              type: object
              description: Required for translation
              required: [recipientName, phone, line1, city, province]
              properties:
                recipientName: { type: string, maxLength: 100 }
                phone: { type: string, pattern: '^\+92[0-9]{9,10}$' }
                line1: { type: string, maxLength: 200 }
                line2: { type: string, maxLength: 200 }
                city: { type: string, maxLength: 80 }
                province: { type: string, enum: [punjab, sindh, kpk, balochistan, islamabad, gb, ajk] }
                postalCode: { type: string, pattern: '^[0-9]{5}$' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: VIP-7K3M9QXA }
        service: { type: string, enum: [premium, translation, appointment] }
        status: { type: string, enum: [awaiting_payment, pending_verification, rejected, paid, in_progress, ready, dispatched, delivered, completed, cancelled, refunded] }
        total: { $ref: '#/components/schemas/Money' }
        payable: { $ref: '#/components/schemas/Money' }
        bankDetails:
          type: object
          description: From app_config, shown while awaiting_payment
          properties: { accountTitle: { type: string }, bankName: { type: string }, iban: { type: string }, transferNote: { type: string } }
        verificationDueAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            lines: { type: array, items: { type: object } }
            timeline: { type: array, items: { type: object, properties: { status: { type: string }, at: { type: string, format: date-time }, note: { type: [string, 'null'] } } } }
            rejection: { type: [object, 'null'], properties: { reason: { type: string }, note: { type: [string, 'null'] } } }
            shipment: { type: [object, 'null'], properties: { status: { type: string }, courierName: { type: string }, trackingRef: { type: string } } }
            receiptAvailable: { type: boolean }
            refund:
              type: object
              properties:
                eligible: { type: boolean }
                reason: { type: string, description: Human explanation of why / why not }
                eligibleUntil: { type: [string, 'null'], format: date-time }
                openRequest: { oneOf: [ { $ref: '#/components/schemas/RefundRequest' }, { type: 'null' } ] }
    OrderList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        nextCursor: { type: [string, 'null'] }

    ReasonCode:
      type: object
      properties: { code: { type: string }, label: { type: string } }
    CreateRefundInput:
      type: object
      required: [reasonCode, clientRequestId]
      properties:
        reasonCode: { type: string }
        note: { type: string, maxLength: 1000 }
    RefundRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [requested, reviewed, approved, declined, refunded] }
        amount: { $ref: '#/components/schemas/Money' }
        decisionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    RenewalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicantId: { type: string, format: uuid }
        status: { type: string, enum: [requested, approved, declined] }
        createdAt: { type: string, format: date-time }

    SupportThread:
      type: object
      properties:
        status: { type: string, enum: [none, open, awaiting_support, awaiting_user, closed] }
        tier: { type: string, enum: [free, paid] }
        slaDueAt: { type: [string, 'null'], format: date-time, description: Working-hours-computed deadline; null unless awaiting_support }
        workingHoursText: { type: [string, 'null'], description: CMS copy shown beside every SLA statement }
        allowedTopics: { type: array, items: { type: string } }
        unreadCount: { type: integer }
    SupportMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderType: { type: string, enum: [user, admin, system] }
        body: { type: string }
        topic: { type: [string, 'null'] }
        applicantId: { type: [string, 'null'], format: uuid }
        attachment: { type: [object, 'null'], properties: { id: { type: string, format: uuid }, mime: { type: string } } }
        createdAt: { type: string, format: date-time }
        readByUserAt: { type: [string, 'null'], format: date-time }
    SupportMessageList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SupportMessage' } }
        nextCursor: { type: [string, 'null'] }
    CreateSupportMessageInput:
      type: object
      required: [topic]
      properties:
        body: { type: string, maxLength: 4000, description: Required unless attachmentId is given }
        topic: { type: string, enum: [payment, order, courier, refund, account, app_problem, presales] }
        applicantId: { type: string, format: uuid }
        attachmentId: { type: string, format: uuid }

    ReferralSummary:
      type: object
      properties:
        code: { type: string }
        shareUrl: { type: string, format: uri }
        rewardPerReferral: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        minWithdrawal: { $ref: '#/components/schemas/Money' }
        history:
          type: array
          items: { type: object, properties: { refereeLabel: { type: string, description: 'Masked, e.g. "A***"' }, status: { type: string }, credited: { $ref: '#/components/schemas/Money' }, at: { type: string, format: date-time } } }
    PayoutAccountInput:
      type: object
      required: [accountTitle, bankName, iban]
      properties:
        accountTitle: { type: string, maxLength: 100 }
        bankName: { type: string, maxLength: 100 }
        iban: { type: string, pattern: '^PK[0-9]{2}[A-Z]{4}[0-9]{16}$', description: 'Pakistani IBAN, 24 chars' }
    PayoutAccountMasked:
      type: [object, 'null']
      properties: { accountTitle: { type: string }, bankName: { type: string }, last4: { type: string } }
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [requested, reviewed, approved, paid, rejected] }
        createdAt: { type: string, format: date-time }

    PreferencesInput:
      type: object
      properties:
        locale: { type: string, enum: [en, ur] }
        consents:
          type: object
          properties: { analytics: { type: boolean }, crash_reports: { type: boolean }, marketing_push: { type: boolean } }

    AdminProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: [string, 'null'] }
        isSuper: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        scopes: { type: array, items: { type: string, enum: [payment_approve, translation_manage, appointment_manage, verification_manage, referral_payout, cash_dept, pricing_config, legal_manage, expiry_manage, support_manage, refund_manage, read_only] } }
        linked: { type: boolean, description: 'false until the pre-registered admin first signs in' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminMe:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        isSuper: { type: boolean }
        scopes:
          type: array
          items: { type: string, enum: [payment_approve, translation_manage, appointment_manage, verification_manage, referral_payout, cash_dept, pricing_config, legal_manage, expiry_manage, support_manage, refund_manage, read_only] }
