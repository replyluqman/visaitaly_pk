openapi: 3.1.0
info:
  title: VisaItaly PK API
  version: 0.2.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Contract for the Flutter app (`/v1`) and the admin CMS (`/admin/v1`).

    **Source of truth for shapes is `@visaitaly/shared`.** This file mirrors it so
    Flutter (freezed models) and the CMS can be built against a fixed contract.
    When the two disagree, the shared package wins and this file is the bug.
    `docs/API-CONTRACT.md` describes the built surface (Modules 1–2) in prose with client
    actions per error code; this file is the machine-readable superset incl. planned routes.
    Module numbers match docs/ROADMAP.md (checklist = 3, documents/today = 3b, CMS = 4).

    `x-status: live` = implemented (Modules 1–2). `x-status: planned` = contract
    agreed, not built. `x-module` = build-order module (PRD §25).

    Conventions:
    - Auth: `Authorization: Bearer <Firebase ID token>` + `X-Device-Id: <uuid v4>` on every `/v1` route except `/health`, `/v1/auth/session`, `/v1/public/*`.
    - Admin routes use a token from the **separate admin Firebase project**; no `X-Device-Id`.
    - Unauthorised access to another user's resource returns **404, never 403** (SECURITY.md).
    - Lists paginate by opaque `cursor` (keyset on `created_at, id`). Never offset.
    - Money is integer minor units (`amountMinor`) + ISO 4217 `currency`.
    - Dates are `YYYY-MM-DD`; timestamps are RFC 3339 UTC.
    - Clients branch on `error.code`, never `error.message`.
    - Idempotent creates take `clientRequestId` (uuid); a replay returns the original resource.
servers:
  - url: https://api.visaitaly.pk
    description: production
  - url: https://api-staging.visaitaly.pk
    description: staging
  - url: http://localhost:8787
    description: wrangler dev

security:
  - firebaseUser: []
    deviceId: []

tags:
  - { name: system }
  - { name: public, description: 'Pre-auth surfaces: Eligibility Quick Check, How We Verify, pricing' }
  - { name: auth }
  - { name: legal }
  - { name: onboarding }
  - { name: applicants }
  - { name: checklist }
  - { name: documents }
  - { name: today }
  - { name: notifications }
  - { name: orders }
  - { name: refunds }
  - { name: premium }
  - { name: support }
  - { name: referral }
  - { name: account }
  - { name: admin }

paths:
  # ───────────────────────────────────────── system / public
  /health:
    get:
      tags: [system]
      summary: Liveness
      security: []
      x-status: live
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /v1/public/eligibility-check:
    get:
      tags: [public]
      summary: Quick Check question set (Screen 2)
      security: []
      x-status: live
      x-module: 3
      description: CMS-driven questions. Cached at the edge (Cache-Control public, 1h).
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityQuestionSet' } } } }
    post:
      tags: [public]
      summary: Orientation result — never a verdict (PRD §11, §18 risk 1)
      security: []
      x-status: live
      x-module: 3
      description: Stateless. Answers are not persisted server-side. Rate-limited per IP.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityAnswers' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityResult' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/public/verification-summary:
    get:
      tags: [public]
      summary: How We Verify stats + recent updates (Screen 15)
      security: []
      x-status: planned
      x-module: 4
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationSummary' } } } }

  /v1/public/pricing:
    get:
      tags: [public]
      summary: Current CMS prices for paywall, appointment, translation, courier
      security: []
      x-status: planned
      x-module: 6
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PricingResponse' } } } }

  /v1/public/app-config:
    get:
      tags: [public]
      summary: Client-visible config — SLA, working hours, feature flags (urdu_content_complete), min app version
      security: []
      x-status: planned
      x-module: 5
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PublicConfig' } } } }

  # ───────────────────────────────────────── auth & devices
  /v1/auth/session:
    post:
      tags: [auth]
      summary: Register device after Firebase sign-in; evicts oldest beyond limit (PRD §2)
      security: [ { firebaseUser: [] } ]
      x-status: live
      x-module: 1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterSessionInput' } } } }
      responses:
        '200': { description: existing user, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterSessionResponse' } } } }
        '201': { description: new user, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterSessionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/me:
    get:
      tags: [auth]
      summary: App-launch snapshot — identity, entitlement, onboarding, devices
      x-status: live
      x-module: 1
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/devices:
    get:
      tags: [account]
      x-status: live
      x-module: 1
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { devices: { type: array, items: { $ref: '#/components/schemas/DeviceSummary' } } } } } } }
  /v1/devices/{deviceId}:
    delete:
      tags: [account]
      summary: Remote sign-out of another device
      x-status: live
      x-module: 1
      parameters: [ { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: signed out }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/current/push-token:
    put:
      tags: [account]
      summary: Update FCM token for the calling device
      x-status: planned
      x-module: 5
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fcmToken], properties: { fcmToken: { type: string, maxLength: 512 } } } } } }
      responses:
        '204': { description: updated }

  # ───────────────────────────────────────── legal & onboarding
  /v1/legal/current:
    get:
      tags: [legal]
      parameters: [ { $ref: '#/components/parameters/Locale' } ]
      x-status: live
      x-module: 2
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentLegalResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/legal/current/{docType}:
    get:
      tags: [legal]
      x-status: live
      x-module: 2
      parameters: [ { name: docType, in: path, required: true, schema: { type: string, enum: [disclaimer, terms, privacy] } } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LegalDocumentResponse' } } } }
  /v1/legal/accept:
    post:
      tags: [legal]
      x-status: live
      x-module: 2
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [versionIds], properties: { versionIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }, appVersion: { type: string, maxLength: 32 } } } } } }
      responses:
        '200': { description: accepted, content: { application/json: { schema: { type: object, properties: { acceptedVersionIds: { type: array, items: { type: string, format: uuid } }, onboardingState: { type: string } } } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/onboarding/applicant-count:
    patch:
      tags: [onboarding]
      x-status: live
      x-module: 2
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [declaredApplicantCount], properties: { declaredApplicantCount: { type: integer, minimum: 1, maximum: 99 } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { declaredApplicantCount: { type: integer }, onboardingState: { type: string } } } } } }
        '403': { description: LEGAL_ACCEPTANCE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/reference/relationships:
    get:
      tags: [onboarding]
      parameters: [ { $ref: '#/components/parameters/Locale' } ]
      x-status: live
      x-module: 2
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { relationships: { type: array, items: { $ref: '#/components/schemas/RelationshipOption' } } } } } } }

  # ───────────────────────────────────────── applicants
  /v1/applicants:
    parameters: [ { $ref: '#/components/parameters/Locale' } ]
    get:
      tags: [applicants]
      summary: All applicants with readiness (bounded by app_config.onboarding.max_applicants)
      x-status: live
      x-module: 2
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicantListResponse' } } } }
    post:
      tags: [applicants]
      x-status: live
      x-module: 2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateApplicantInput' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicantWithOnboarding' } } } }
        '403': { description: LEGAL_ACCEPTANCE_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: APPLICANT_LIMIT_REACHED or ONBOARDING_STEP_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/applicants/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [applicants]
      x-status: live
      x-module: 2
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Applicant' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [applicants]
      description: A relationship/DOB/location change re-evaluates applicability in the same transaction (Module 4).
      x-status: live
      x-module: 2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchApplicantInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Applicant' } } } }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [applicants]
      summary: Soft delete. Blocked while the applicant has a purchase.
      x-status: live
      x-module: 2
      responses:
        '200': { description: deleted, content: { application/json: { schema: { type: object, properties: { onboardingState: { type: string } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/applicants/{id}/stage:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [applicants]
      summary: Set stage; generates the case in the same transaction (invariant 10)
      x-status: live
      x-module: 2
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentStage], properties: { currentStage: { $ref: '#/components/schemas/JourneyStage' } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicantWithOnboarding' } } } }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/applicants/{id}/journey:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [applicants]
      summary: Stage timeline (Screen 12)
      x-status: live
      x-module: 3
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/JourneyResponse' } } } }
  /v1/applicants/{id}/visa-granted:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [premium]
      summary: User self-confirms visa granted → grace starts (PRD §7)
      x-status: planned
      x-module: 7
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Applicant' } } } }
  /v1/applicants/{id}/renewal-requests:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [premium]
      summary: Request renewal after grace (admin-gated, never automatic)
      x-status: planned
      x-module: 7
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/RenewalRequest' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────────────────── checklist / case
  /v1/applicants/{id}/checklist:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [checklist]
      summary: Case file (Screen 10). Free users get 3 items + lockedCount.
      x-status: live
      x-module: 3
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Delta sync — only rows changed after this timestamp }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ItemDisplayStatus' } }
        - { name: blocking, in: query, schema: { type: boolean } }
        - { name: translation, in: query, schema: { type: boolean } }
        - { name: apostille, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ChecklistResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/checklist/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [checklist]
      summary: Item detail (Screen 11)
      x-status: live
      x-module: 3
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ChecklistItemDetail' } } } }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [checklist]
      summary: Set status. Offline-queued mutations send baseVersion for conflict detection (PRD §12).
      x-status: live
      x-module: 3
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchChecklistItemInput' } } } }
      responses:
        '200': { description: applied, content: { application/json: { schema: { $ref: '#/components/schemas/ChecklistItem' } } } }
        '409': { description: 'Server changed since baseVersion — item now carries needsReview. Code CHECKLIST_CONFLICT.', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/checklist/{id}/acknowledge-review:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [checklist]
      summary: Clear the Needs Review badge after the user re-checks the item
      x-status: live
      x-module: 3
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ChecklistItem' } } } }

  # ───────────────────────────────────────── documents (R2)
  /v1/documents:
    get:
      tags: [documents]
      summary: My Documents (Screen 14)
      x-status: live
      x-module: "3b"
      parameters:
        - { name: applicantId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentList' } } } }
  /v1/documents/upload-url:
    post:
      tags: [documents]
      summary: Step 1 — get a short-lived signed PUT URL. Quota + type checked here.
      x-status: live
      x-module: "3b"
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } } }
        '402': { $ref: '#/components/responses/PremiumRequired' }
        '413': { description: 'Quota exceeded or file too large. Code UPLOAD_TOO_LARGE / UPLOAD_QUOTA_EXCEEDED.' }
  /v1/documents/{id}/complete:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [documents]
      summary: Step 2 — confirm upload; server verifies size + magic bytes from R2 head/range read
      x-status: live
      x-module: "3b"
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '422': { description: 'Magic bytes do not match declared type. Code UPLOAD_REJECTED.' }
  /v1/documents/{id}/content:
    parameters: [ { $ref: '#/components/parameters/Id' }, { name: exp, in: query, required: true, schema: { type: integer } }, { name: sig, in: query, required: true, schema: { type: string } } ]
    put:
      tags: [documents]
      summary: The upload. Capability URL from upload-url — no session. Body = raw bytes; Content-Length and Content-Type must match what was reserved.
      security: []
      x-status: live
      x-module: "3b"
      responses:
        '204': { description: stored }
        '404': { description: 'Bad/expired/wrong-verb signature, or not an open upload — always opaque' }
        '422': { description: 'UPLOAD_REJECTED — length or type differs from the reservation' }
    get:
      tags: [documents]
      summary: The bytes. Capability URL from GET /v1/documents/{id} (viewUrl) — no session. Streamed, no-store, nosniff.
      security: []
      x-status: live
      x-module: "3b"
      responses:
        '200': { description: ok }
        '404': { description: opaque }
  /v1/documents/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [documents]
      summary: Metadata + short-lived signed GET URL
      x-status: live
      x-module: "3b"
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      summary: Deletes the R2 object, not only the row (SECURITY.md)
      x-status: live
      x-module: "3b"
      responses:
        '204': { description: deleted }

  # ───────────────────────────────────────── today / notifications
  /v1/today:
    get:
      tags: [today]
      summary: Top 3–5 actions across applicants, read from next_actions (Screen 9)
      x-status: live
      x-module: "3b"
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TodayResponse' } } } }

  /v1/notifications:
    get:
      tags: [notifications]
      summary: Inbox per tab (Screen 13)
      x-status: planned
      x-module: 5
      parameters:
        - { name: tab, in: query, required: true, schema: { type: string, enum: [reminder, update, activity] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } } }
  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Bell badge — single indexed count (PRD §4 constraint 5)
      x-status: planned
      x-module: 5
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, byTab: { type: object, properties: { reminder: { type: integer }, update: { type: integer }, activity: { type: integer } } } } } } } }
  /v1/notifications/{id}/read:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [notifications]
      x-status: planned
      x-module: 5
      responses: { '204': { description: marked } }
  /v1/notifications/read-all:
    post:
      tags: [notifications]
      x-status: planned
      x-module: 5
      requestBody: { content: { application/json: { schema: { type: object, properties: { tab: { type: string, enum: [reminder, update, activity] } } } } } }
      responses: { '204': { description: marked } }
  /v1/notification-preferences:
    get:
      tags: [account]
      x-status: planned
      x-module: 5
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
    put:
      tags: [account]
      x-status: planned
      x-module: 5
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses: { '200': { description: ok } }

  # ───────────────────────────────────────── orders & payments
  /v1/orders/quote:
    post:
      tags: [orders]
      summary: Price a prospective order server-side (Checkout breakdown). Never trust client totals.
      x-status: planned
      x-module: 6
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDraft' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
  /v1/orders:
    get:
      tags: [orders]
      summary: My Orders (Screen 23)
      x-status: planned
      x-module: 6
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } } }
    post:
      tags: [orders]
      summary: Place order — price snapshot written here (Screen 20). Idempotent on clientRequestId.
      x-status: planned
      x-module: 6
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderInput' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: 'PRICE_CHANGED — quote is stale; re-quote. Or APPLICANT_ALREADY_PREMIUM.' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/orders/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [orders]
      summary: Order detail incl. timeline, shipment, refund eligibility (Screen 24)
      x-status: planned
      x-module: 6
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/orders/{id}/payment-proof/upload-url:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [orders]
      x-status: planned
      x-module: 6
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } } }
